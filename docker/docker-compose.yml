# CBaldur Docker 部署：前端（nginx）+ 后端 + PostgreSQL + Memcached
# 使用前：cd docker && cp .env.example .env 并填写；启动：docker compose up -d --build
# 详见 DEPLOY.md
name: cbaldur

services:
  frontend:
    build:
      context: ../cbaldur-frontend
      args:
        NODE_IMAGE: ${DOCKER_MIRROR:-docker.io}/library/node:22-alpine
        NGINX_IMAGE: ${DOCKER_MIRROR:-docker.io}/library/nginx:1.27-alpine
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ../cbaldur-backend
      # 沙箱绘图用的中文字体（docker/AlibabaPuHuiTi.otf）
      additional_contexts:
        fonts: .
      args:
        BASE_IMAGE: ${UBI_IMAGE:-registry.access.redhat.com/ubi9/ubi:latest}
        INSTALL_AI_SANDBOX: ${INSTALL_AI_SANDBOX:-true}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PostgreSQL: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-fusim};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}"
      UserDir: /cbaldur
      Memcached__Host: memcached
      Memcached__Port: "11211"
      Jwt__Key: ${JWT_KEY:?请在 .env 中设置 JWT_KEY（至少 32 字符的随机串）}
      Frontend__Url: ${FRONTEND_URL:-http://localhost:3000}
      Email__SmtpServer: ${EMAIL_SMTP_SERVER:-}
      Email__SmtpPort: ${EMAIL_SMTP_PORT:-465}
      Email__Username: ${EMAIL_USERNAME:-}
      Email__Password: ${EMAIL_PASSWORD:-}
      Email__FromEmail: ${EMAIL_FROM:-}
      GitHub__ClientId: ${GITHUB_CLIENT_ID:-}
      GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET:-}
      SemanticScholar__ApiKey: ${SEMANTIC_SCHOLAR_API_KEY:-}
      # AI 助手（OpenAI 兼容接口），未配置时站点照常运行、AI 入口隐藏
      Ai__OpenAI__BaseUrl: ${AI_OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      Ai__OpenAI__ModelId: ${AI_OPENAI_MODEL_ID:-}
      Ai__OpenAI__ApiKey: ${AI_OPENAI_API_KEY:-}
      Ai__OpenAI__FastReasoningEffort: ${AI_OPENAI_FAST_REASONING_EFFORT:-none}
      Ai__OpenAI__DeepReasoningEffort: ${AI_OPENAI_DEEP_REASONING_EFFORT:-high}
      # 论文语义检索向量模型（可选，不配置则用关键词检索）
      Ai__Embedding__BaseUrl: ${AI_EMBEDDING_BASE_URL:-}
      Ai__Embedding__ModelId: ${AI_EMBEDDING_MODEL_ID:-}
      Ai__Embedding__ApiKey: ${AI_EMBEDDING_API_KEY:-}
      # Python 分析沙箱（Bubblewrap），需要下方 seccomp=unconfined
      Ai__Sandbox__Enabled: ${AI_SANDBOX_ENABLED:-true}
    volumes:
      # 算例数据（UserDir）
      - ${DATA_DIR:-./data}:/cbaldur
      - ./logs:/app/out/logs
    # Bubblewrap 需要创建用户命名空间（Docker 默认 seccomp 会拦截），并在新命名空间中挂载 /proc
    # （Docker 默认屏蔽的 /proc 子路径会导致挂载失败）；沙箱任务本身另由 bwrap 隔离（无网络、只读、资源限制）。
    # 不启用 AI 沙箱时可删除这两项。
    security_opt:
      - seccomp=unconfined
      - systempaths=unconfined
    ports:
      # 仅本机可访问，便于调试；对外统一走 frontend
      - "127.0.0.1:${BACKEND_PORT:-5168}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      memcached:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: ${DOCKER_MIRROR:-docker.io}/library/postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fusim}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - ${POSTGRES_DATA_DIR:-./postgres}:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      # 默认只绑定本机，需远程管理时改为 0.0.0.0
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped

  memcached:
    image: ${DOCKER_MIRROR:-docker.io}/library/memcached:1.6.38-alpine
    restart: unless-stopped
