# PaperPilot Docker 部署：前端（nginx）+ 后端（FastAPI + SQLite）
# 使用前：cd docker && cp .env.example .env 并填写；启动：docker compose up -d --build
# 详见 DEPLOY.md
name: paperpilot

services:
  frontend:
    build:
      context: ../cbaldur-frontend
      args:
        NODE_IMAGE: ${DOCKER_MIRROR:-docker.io}/library/node:22-alpine
        NGINX_IMAGE: ${DOCKER_MIRROR:-docker.io}/library/nginx:1.27-alpine
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ../paper-backend
      args:
        PYTHON_IMAGE: ${DOCKER_MIRROR:-docker.io}/library/python:3.13-slim
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      JWT_KEY: ${JWT_KEY:?请在 .env 中设置 JWT_KEY（至少 32 字符的随机串）}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      # AI 功能（OpenAI 兼容接口），未配置时站点照常运行
      AI_OPENAI_BASE_URL: ${AI_OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      AI_OPENAI_MODEL_ID: ${AI_OPENAI_MODEL_ID:-}
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
    volumes:
      # 数据库和上传的 PDF
      - paper-data:/app/data
    restart: unless-stopped

volumes:
  paper-data:
