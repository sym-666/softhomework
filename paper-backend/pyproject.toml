[project]
name = "paperpilot-backend"
version = "0.1.0"
description = "PaperPilot 后端"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai>=1.40",
    "pydantic-settings>=2.4",
    "pymupdf>=1.24",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "rank-bm25>=0.2.2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["alembic/versions"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的依赖声明写在参数默认值里，是框架的标准用法
extend-immutable-calls = ["fastapi.Cookie", "fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]
